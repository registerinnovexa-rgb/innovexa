<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Innovexa OS</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap');
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      background: radial-gradient(circle at center, #0a0e17 0%, #000 100%);
      color: #fff;
      height: 100vh;
      width: 100vw;
    }
    
    /* Wallpaper / Background */
    .os-bg {
      position: absolute; inset: 0; z-index: -1;
      background-image: radial-gradient(rgba(0,107,255,.1) 1.2px, transparent 1.2px);
      background-size: 24px 24px;
    }
    .os-glow {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 600px; height: 600px; border-radius: 50%;
      background: radial-gradient(circle, rgba(0,107,255,.15) 0%, transparent 60%);
      pointer-events: none;
    }

    /* Desktop Icons */
    .desktop { padding: 24px; display: flex; flex-direction: column; gap: 24px; align-items: flex-start; }
    .icon {
      width: 80px; display: flex; flex-direction: column; align-items: center; gap: 8px;
      cursor: pointer; text-align: center; border-radius: 8px; padding: 12px 8px;
      transition: background 0.2s;
    }
    .icon:hover { background: rgba(255,255,255,0.1); }
    .icon-img { font-size: 2.5rem; }
    .icon-label { font-size: 0.8rem; font-weight: 500; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }

    /* Taskbar */
    .taskbar {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 48px;
      background: rgba(15, 20, 28, 0.85); backdrop-filter: blur(12px); border-top: 1px solid rgba(255,255,255,0.1);
      display: flex; align-items: center; justify-content: space-between; padding: 0 16px; z-index: 1000;
    }
    .taskbar-left { display: flex; align-items: center; gap: 12px; }
    .start-btn { 
      background: #006BFF; padding: 6px 16px; border-radius: 6px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; gap: 8px; font-size: 0.9rem;
    }
    .taskbar-right { display: flex; align-items: center; gap: 16px; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; color: rgba(255,255,255,0.7); }

    /* Window */
    .window {
      position: absolute; top: 100px; left: 150px; width: 600px; height: 450px;
      background: rgba(10, 14, 23, 0.95); backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5); display: none; flex-direction: column;
      resize: both; overflow: hidden;
    }
    .window.active { display: flex; z-index: 100; }
    .title-bar {
      height: 36px; background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; cursor: grab; border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .title-bar:active { cursor: grabbing; }
    .title-text { font-size: 0.85rem; font-weight: 600; color: rgba(255,255,255,0.8); display: flex; align-items: center; gap: 8px; }
    .controls { display: flex; gap: 8px; }
    .control-btn { width: 12px; height: 12px; border-radius: 50%; cursor: pointer; }
    .close-btn { background: #ff5f56; } .min-btn { background: #ffbd2e; } .max-btn { background: #27c93f; }
    
    .window-content { padding: 24px; flex-grow: 1; overflow-y: auto; }
    
    /* Preloader */
    #os-boot {
      position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center;
      transition: opacity 0.5s ease;
    }
    .boot-text { font-family: 'JetBrains Mono', monospace; color: #fff; font-size: 1.2rem; }
  </style>
</head>
<body>

  <!-- OS Boot Screen -->
  <div id="os-boot">
    <div class="boot-text">Booting Innovexa OS v2.0...</div>
  </div>

  <div class="os-bg"></div>
  <div class="os-glow"></div>

  <!-- Desktop -->
  <div class="desktop">
    <div class="icon" onclick="openWindow('main-window')">
      <div class="icon-img">⚡</div>
      <div class="icon-label">Portal.exe</div>
    </div>
    <div class="icon" onclick="window.location.href='index.html'">
      <div class="icon-img">🌐</div>
      <div class="icon-label">Exit to Web</div>
    </div>
  </div>

  <!-- Windows -->
  <div class="window active" id="main-window">
    <div class="title-bar" id="main-window-header">
      <div class="title-text">⚡ Innovexa Portal</div>
      <div class="controls">
        <div class="control-btn min-btn"></div>
        <div class="control-btn max-btn"></div>
        <div class="control-btn close-btn" onclick="closeWindow('main-window')"></div>
      </div>
    </div>
    <div class="window-content">
      <h2 style="margin-bottom: 16px;">Welcome to the Mainframe</h2>
      <p style="color: rgba(255,255,255,0.7); line-height: 1.6; margin-bottom: 24px;">
        You have accessed the internal operating system. From here, you can register as an operative or explore the network.
      </p>
      <a href="register.html" style="display: inline-block; background: #006BFF; color: #fff; padding: 12px 24px; border-radius: 6px; text-decoration: none; font-weight: 600;">Register Now</a>
    </div>
  </div>

  <!-- Taskbar -->
  <div class="taskbar">
    <div class="taskbar-left">
      <div class="start-btn">🌀 Start</div>
      <div style="font-size: 0.85rem; font-weight: 600; padding: 4px 12px; background: rgba(255,255,255,0.1); border-radius: 4px;">Portal.exe</div>
    </div>
    <div class="taskbar-right">
      <span id="clock">12:00 PM</span>
    </div>
  </div>

  <script>
    // Boot sequence
    setTimeout(() => {
      document.getElementById('os-boot').style.opacity = '0';
      setTimeout(() => document.getElementById('os-boot').style.display = 'none', 500);
    }, 1500);

    // Clock
    setInterval(() => {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    }, 1000);

    // Window Management
    function openWindow(id) {
      document.getElementById(id).style.display = 'flex';
      bringToFront(document.getElementById(id));
    }
    function closeWindow(id) {
      document.getElementById(id).style.display = 'none';
    }
    
    let zIndex = 100;
    function bringToFront(el) {
      zIndex++;
      el.style.zIndex = zIndex;
    }

    // Draggable logic
    const win = document.getElementById('main-window');
    const header = document.getElementById('main-window-header');
    let isDragging = false, startX, startY, initialX, initialY;

    header.addEventListener('mousedown', (e) => {
      isDragging = true;
      startX = e.clientX; startY = e.clientY;
      initialX = win.offsetLeft; initialY = win.offsetTop;
      bringToFront(win);
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      win.style.left = `${initialX + dx}px`;
      win.style.top = `${initialY + dy}px`;
    });

    document.addEventListener('mouseup', () => { isDragging = false; });
  </script>
</body>
</html>
