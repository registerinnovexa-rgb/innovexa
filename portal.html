<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Innovexa Portal — Member Dashboard</title>
  <meta name="description" content="Innovexa Labs Member Portal — access events, announcements, documents, and more.">
  <link rel="icon" href="/logo-icon.png">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Portal Styles -->
  <link rel="stylesheet" href="/css/style.css">
  <style>
    /* ── Override: use the portal CSS variables on the body ── */
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0; padding: 0;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    #app { min-height: 100vh; }

    /* ── Mobile Hamburger ── */
    .mobile-menu-btn {
      display: none;
      position: fixed; top: 12px; left: 12px; z-index: 200;
      background: var(--white); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 10px; cursor: pointer;
      font-size: 1.2rem; box-shadow: var(--shadow-sm);
    }
    .sidebar-overlay {
      display: none;
      position: fixed; inset: 0; background: rgba(0,0,0,0.4);
      z-index: 99; backdrop-filter: blur(2px);
    }
    @media (max-width: 768px) {
      .mobile-menu-btn { display: flex; align-items: center; justify-content: center; }
      .sidebar-overlay.visible { display: block; }
      .sidebar { transform: translateX(-100%); transition: transform 0.3s ease; }
      .sidebar.open { transform: translateX(0); }
      .main { margin-left: 0 !important; }
      .topbar { padding: 12px 16px 12px 56px !important; }
      .content { padding: 20px 16px !important; }
      .stats { grid-template-columns: 1fr 1fr !important; }
      .grid { grid-template-columns: 1fr !important; }
      .form-row { grid-template-columns: 1fr !important; }
      .profile-grid { grid-template-columns: 1fr !important; }
      table { font-size: 0.8rem; }
      th, td { padding: 8px 12px !important; }
    }
    @media (max-width: 480px) {
      .stats { grid-template-columns: 1fr !important; }
      .auth-card { padding: 28px 20px !important; }
    }
  </style>
</head>
<body>
  <!-- Mobile sidebar toggle -->
  <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Open menu">☰</button>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div id="app">
    <div class="loading"><div class="spinner"></div></div>
  </div>

  <script type="module">
    import { initApp } from './js/app.js'
    document.addEventListener('DOMContentLoaded', initApp)

    // Mobile sidebar toggle
    const btn = document.getElementById('mobile-menu-btn')
    const overlay = document.getElementById('sidebar-overlay')
    function openSidebar() {
      const sb = document.querySelector('.sidebar')
      if (sb) { sb.classList.add('open'); overlay.classList.add('visible') }
    }
    function closeSidebar() {
      const sb = document.querySelector('.sidebar')
      if (sb) { sb.classList.remove('open'); overlay.classList.remove('visible') }
    }
    btn?.addEventListener('click', openSidebar)
    overlay?.addEventListener('click', closeSidebar)
  </script>
</body>
</html>
