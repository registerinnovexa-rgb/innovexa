<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mission Feedback</title>
  <style>
    body {
      background: #ffffff !important;
      color: #000000 !important;
      font-family: Arial, sans-serif !important;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .feedback-container {
      max-width: 500px;
      width: 100%;
    }
    h1 {
      font-size: 24px;
      text-transform: uppercase;
      border-bottom: 2px solid #000000;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }
    p {
      font-size: 14px;
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      text-transform: uppercase;
      font-size: 12px;
    }
    input[type="text"], textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      border: 1px solid #000000;
      background: #ffffff;
      color: #000000;
      font-family: inherit;
      border-radius: 0;
    }
    .rating-group {
      display: flex;
      flex-direction: row-reverse;
      justify-content: flex-end;
      gap: 5px;
    }
    .rating-group input {
      display: none;
    }
    .rating-group label {
      font-size: 24px;
      color: #cccccc;
      cursor: pointer;
      text-transform: none;
      display: inline-block;
    }
    .rating-group label:hover,
    .rating-group label:hover ~ label,
    .rating-group input:checked ~ label {
      color: #000000;
    }
    button {
      background: #000000;
      color: #ffffff;
      border: none;
      padding: 12px 20px;
      width: 100%;
      text-transform: uppercase;
      font-weight: bold;
      cursor: pointer;
      border-radius: 0;
    }
    button:hover {
      background: #333333;
    }
    #loadingState, #successState {
      display: none;
      border: 1px solid #000000;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #000000;
      color: #ffffff;
      padding: 10px 20px;
      display: none;
    }
    .toast.show {
      display: block;
    }
  </style>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
</head>
<body>
  <div class="feedback-container">
    <h1>Mission Feedback</h1>
    <p>Please submit your operational telemetry below.</p>
    
    <div id="loadingState">Transmitting data...</div>
    <div id="successState">
      <h2>Transmission Received</h2>
      <p>Thank you for your feedback.</p>
      <button onclick="window.location.href='index.html'">Return</button>
    </div>

    <form id="feedbackForm" onsubmit="submitFeedback(event)">
      <div class="form-group">
        <label>Operative ID</label>
        <input type="text" id="opId" placeholder="INVX-XX" required>
      </div>
      
      <div class="form-group">
        <label>Rate the Operation (1-5)</label>
        <div class="rating-group">
          <input type="radio" id="star5" name="rating" value="5" required><label for="star5">★</label>
          <input type="radio" id="star4" name="rating" value="4"><label for="star4">★</label>
          <input type="radio" id="star3" name="rating" value="3"><label for="star3">★</label>
          <input type="radio" id="star2" name="rating" value="2"><label for="star2">★</label>
          <input type="radio" id="star1" name="rating" value="1"><label for="star1">★</label>
        </div>
      </div>
      
      <div class="form-group">
        <label>After Action Report (Comments)</label>
        <textarea id="comments" rows="5" required></textarea>
      </div>
      
      <button type="submit">Submit</button>
    </form>
  </div>

  <div id="toast" class="toast"></div>

  <script src="/js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      try {
        const sessionStr = localStorage.getItem('forge_session');
        if (sessionStr) {
          const session = JSON.parse(sessionStr);
          if (session && session.operativeId) {
            document.getElementById('opId').value = session.operativeId;
          }
        }
      } catch (e) {
        console.error("Failed to parse forge_session from localStorage", e);
      }
    });

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = 'toast show';
      setTimeout(() => { toast.className = 'toast'; }, 3000);
    }

    async function submitFeedback(e) {
      e.preventDefault();
      const urlParams = new URLSearchParams(window.location.search);
      const eventId = urlParams.get('eventId') || urlParams.get('session');
      
      if(!eventId) {
        return showToast("Error: Missing Event ID in URL.");
      }
      
      const opId = document.getElementById('opId').value.trim().toUpperCase();
      const rating = document.querySelector('input[name="rating"]:checked').value;
      const comments = document.getElementById('comments').value.trim();
      
      document.getElementById('feedbackForm').style.display = 'none';
      document.getElementById('loadingState').style.display = 'block';
      
      try {
        const res = await apiWrite('public_submit_feedback', {
          eventId: eventId,
          operativeId: opId,
          rating: rating,
          comments: comments
        });
        
        document.getElementById('loadingState').style.display = 'none';
        
        if(res.success) {
          document.getElementById('successState').style.display = 'block';
        } else {
          document.getElementById('feedbackForm').style.display = 'block';
          showToast(res.message);
        }
      } catch(err) {
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('feedbackForm').style.display = 'block';
        showToast("Network connection failed.");
      }
    }
  </script>
</body>
</html>
